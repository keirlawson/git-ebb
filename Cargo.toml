[package]
name = "git-ebb"
version = "0.1.2"
edition = "2024"
description = "List git branches alongside associated PR titles"
license = "MIT OR Apache-2.0"

[dependencies]
octocrab = "0.54.5"
gix = "0.90"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4.4.0"
